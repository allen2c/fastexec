site_name: fastexec
site_description: Execute functions with FastAPI features — no server required.
site_url: https://allen2c.github.io/fastexec
repo_url: https://github.com/allen2c/fastexec
repo_name: allen2c/fastexec

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - attr_list

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Concepts:
      - App & Pipeline: concepts/app-pipeline.md
      - Dependency Injection: concepts/dependency-injection.md
      - State Management: concepts/state.md
      - Validation: concepts/validation.md
      - Visualization: concepts/visualization.md
  - API Reference: api-reference.md
