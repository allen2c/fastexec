[project]
authors = [{ name = "AllenChou", email = "f1470891079@gmail.com" }]
dependencies = ["fastapi[standard]>=0.121.0,<1.0.0"]
description = "Execute function with FastAPI features."
license = "MIT"
name = "fastexec"
readme = "README.md"
requires-python = ">=3.11"
version = "0.7.0"

[project.optional-dependencies]
dev = [
  "faker",
  "psutil",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-xdist",
  "ruff",
  "setuptools>=69",
]
docs = ["mkdocs-material", "mkdocstrings[python]"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = ["-m", "not stress"]
asyncio_mode = "auto"
markers = [
  "stress: long-running memory/leak stress tests (run manually with -m stress)",
]
