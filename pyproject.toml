[project]
authors = [{ name = "AllenChou", email = "f1470891079@gmail.com" }]
dependencies = ["fastapi[standard]>=0.121.0,<1.0.0"]
description = "Define and run serverless workflows with FastAPI's dependency injection."
license = "MIT"
name = "fastexec"
readme = "README.md"
requires-python = ">=3.11"
version = "0.7.0"

[project.optional-dependencies]
dev = [
  "black",
  "faker",
  "graphviz",
  "isort",
  "psutil",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-xdist",
  "ruff",
  "setuptools>=69",
]
docs = ["mkdocs-material", "mkdocstrings[python]"]
viz = ["graphviz"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Imports are handled by isort; formatting by black. ruff is lint-only here.
# E203 conflicts with black, so it is ignored (matches the prior flake8 config).
ignore = ["E203"]
select = ["E", "F"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
line_length = 88
profile = "black"

[tool.pytest.ini_options]
asyncio_mode = "auto"
